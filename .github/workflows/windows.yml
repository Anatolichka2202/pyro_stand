name: Windows and KASUPP integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-2022
    name: Windows / Qt 6.8 / MSVC / KASUPP
    steps:
      - name: Checkout Pyro-stand
        uses: actions/checkout@v4

      - name: Set up Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify report archive validator
        shell: pwsh
        run: python -m unittest discover -s tests -p test_verify_report.py -v

      - name: Configure Pyro-stand
        shell: pwsh
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_GUI_TESTS=ON -DBUILD_HARDWARE_PROBE=ON

      - name: Build Pyro-stand and all test targets
        shell: pwsh
        run: cmake --build build-win --parallel 2

      - name: Pyro-stand C++ tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-win -C Debug --output-on-failure -V

      - name: Python virtual tester checks
        shell: pwsh
        run: python -m unittest discover -s tests -p test_virtual_tester.py -v



      - name: Configure release bundle
        shell: pwsh
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI_TESTS=OFF -DBUILD_HARDWARE_PROBE=OFF

      - name: Build release application
        shell: pwsh
        run: cmake --build build-release --target pyro_stand --parallel 2

      - name: Deploy Qt and package Pyro-stand
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/PyroStand | Out-Null
          Copy-Item build-release/pyro_stand.exe dist/PyroStand/pyro_stand.exe
          Copy-Item README.md dist/PyroStand/README.md
          & windeployqt --release --no-translations --dir dist/PyroStand dist/PyroStand/pyro_stand.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt: exit $LASTEXITCODE" }
          @('[Paths]','Prefix=.','Plugins=.') | Set-Content dist/PyroStand/qt.conf -Encoding ascii
          Compress-Archive -Path dist/PyroStand/* -DestinationPath dist/PyroStand-windows-x64.zip

      - name: Smoke-test packaged EXE without Qt development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist/PyroStand/pyro_stand.exe).Path
          $savedPath = $env:Path
          $env:Path = "$env:WINDIR\System32;$env:WINDIR"
          $env:PYRO_STAND_SMOKE_TEST = '1'
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @(
              '--tester','udp','--board-ip','127.0.0.1',
              '--bind-ip','127.0.0.1','--board-port','59131',
              '--debug-socket','no-real-bcvm-in-ci'
            ) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Packaged Pyro-stand exit code: $($p.ExitCode)" }
          } finally {
            $env:Path = $savedPath
            Remove-Item Env:PYRO_STAND_SMOKE_TEST -ErrorAction SilentlyContinue
          }

      - name: Upload standalone Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PyroStand-Windows-x64-${{ github.sha }}
          path: dist/PyroStand-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  kasu-contract:
    # GitHub Actions token одного private repo не имеет доступа ко второму.
    # Активируется только после явного подключения read-only KASU_READ_TOKEN
    # и установки переменной репозитория RUN_KASU_CONTRACT=true.
    if: ${{ vars.RUN_KASU_CONTRACT == 'true' }}
    runs-on: windows-2022
    name: Real KASUPP publisher contract (authorized)
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private KASUPP
        uses: actions/checkout@v4
        with:
          repository: Anatolichka2202/KASU_KP
          ref: master
          token: ${{ secrets.KASU_READ_TOKEN }}
          path: kasu

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure contract against real KASUPP sources
        shell: pwsh
        run: |
          cmake -S tests/kasu_contract -B build-kasu-contract -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DKASU_SOURCE=$env:GITHUB_WORKSPACE/kasu"

      - name: Build contract
        shell: pwsh
        run: cmake --build build-kasu-contract --parallel 2

      - name: Run contract test
        shell: pwsh
        run: ctest --test-dir build-kasu-contract -C Debug --output-on-failure -V
